<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>大富哥 - 极简主页</title>
    
    <style>
              /* 1. 基础设置 */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #000000; 
            color: #ffffff; 
            display: flex; 
            flex-direction: column; 
        }

        /* 2. 核心内容区域：负责让 Logo 和标语在屏幕正中间 */
        .main-content { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
        }

        /* 3. 图片 Logo 样式 */
        .logo { 
            width: 200px; 
            height: auto; 
            margin-bottom: 24px; 
            opacity: 0; /* 初始透明 */
            animation: fadeInUp 1.5s ease-out forwards; /* 播放动画 */
        }

        /* 4. 标语文字样式（你刚才不小心把它删掉啦，我帮你补上了） */
        .slogan { 
            font-size: 20px; 
            color: #888888; 
            letter-spacing: 2px; 
            opacity: 0; /* 初始透明 */
            animation: fadeInUp 1.5s ease-out 0.5s forwards; /* 延迟 0.5 秒播放动画 */
        }

        /* 5. 底部备案号区域 */
        .footer { 
            padding: 24px; 
            text-align: center; 
            font-size: 12px; 
            color: #444444; 
        }

        /* 6. 动画剧本：从下往上渐渐浮现 */
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>
</head>

<body>
    
    <div class="main-content">
        <img src="logo.png" alt="Thin Red Line Logo" class="logo">
        <div class="slogan">管家式学历提升服务中心</div>
    </div>

    <div class="footer">
        鲁ICP 备13205328399号-1 | 京公网安备DAFU8399号
    </div>

</body>
</html>
